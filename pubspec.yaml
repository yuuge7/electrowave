name: electrowave
description: "An offline desktop music library and player for Windows and Linux."
publish_to: 'none'

version: 1.0.6+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  drift: ^2.34.0
  path_provider: ^2.1.6
  path: ^1.9.1
  audio_metadata_reader: ^1.6.0
  file_picker: ^8.0.0
  data_table_2: ^2.7.2
  intl: ^0.20.3
  sqlite3: ^3.3.4
  screen_retriever: ^0.2.2
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  package_info_plus: ^8.0.0
  archive: ^4.5.2
  image: ^4.12.0
  desktop_drop: ^0.8.4
  dbus: ^0.7.15
  watcher: ^1.2.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/tray_icon.png
    - assets/tray_icon.ico
    - web/music.png

flutter_launcher_icons:
  image_path: "web/music.png"
  linux:
    generate: true
    image_path: "web/music.png"
  windows:
    generate: true
    image_path: "web/music.png"
  macos:
    generate: true
    image_path: "web/music.png"
